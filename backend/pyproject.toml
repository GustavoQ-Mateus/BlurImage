[project]
name = "blurimage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jpeglib>=1.0",
]

[tool.setuptools]
packages = ["app", "app.codecs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
